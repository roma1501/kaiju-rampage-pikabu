<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ярость кайдзю: разрушь город</title>
    <link rel="icon" type="image/png" href="assets/ui/icon.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0c1018;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        @font-face { font-family: 'KRFont'; src: url('assets/fonts/rubik.ttf?v=0.2.5-b24475ef') format('truetype'); font-weight: 300 900; font-display: swap; }
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: clamp(8px, 2.2vh, 18px);
            background: #141A26 url('assets/ui/loading.webp?v=0.2.5-b24475ef') center / cover no-repeat;
            z-index: 1000;
            font-family: 'KRFont', 'Arial Black', system-ui, sans-serif;
        }
        #loading-screen::before { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(12, 16, 24, .35), rgba(12, 16, 24, .82)); }
        #loading-screen > * { position: relative; }
        .loading-text {
            font: 700 clamp(13px, 2.4vh, 18px) 'KRFont', system-ui, sans-serif;
            color: #E9EDF2;
            text-align: center;
            min-height: 1em;
            text-shadow: 0 2px 0 #141A26;
        }
        .loading-bar {
            width: min(340px, 74vw);
            height: clamp(14px, 3vh, 22px);
            background: #141A26;
            border: 3px solid #141A26;
            border-radius: 8px;
            overflow: hidden;
            transform: skewX(-12deg);
            box-shadow: 0 5px 0 rgba(0, 0, 0, .45);
        }
        .loading-progress {
            height: 100%;
            width: 0%;
            background: #FFC400 url('assets/ui/ui_hazard.webp?v=0.2.5-b24475ef') 0 0 / 40px;
            transition: width 0.3s ease;
        }
        #loading-title { margin: 0; font: italic 900 clamp(24px, 6.2vh, 54px)/1 'KRFont', 'Arial Black', sans-serif; text-transform: uppercase; color: #fff; text-align: center; max-width: 92vw;
            -webkit-text-stroke: clamp(4px, .9vh, 8px) #141A26; paint-order: stroke fill; text-shadow: 0 clamp(3px, .8vh, 7px) 0 #141A26; }
        .engine-mark { width: clamp(84px, 24vh, 220px); height: clamp(84px, 24vh, 220px); object-fit: contain; filter: drop-shadow(0 6px 0 #141A26); }
        #loading-percent { font: italic 900 clamp(16px, 3.4vh, 26px) 'KRFont', system-ui, sans-serif; color: #FFC400; text-shadow: 0 2px 0 #141A26; }
        #loading-retry { padding: 12px 28px; border: 3px solid #141A26; border-radius: 10px; background: #FFC400; color: #141A26; font: italic 900 18px 'KRFont', system-ui, sans-serif; text-transform: uppercase; cursor: pointer; box-shadow: 0 5px 0 #141A26; }
    </style>
</head>
<body>
    <canvas id="world3d"></canvas>
    <div id="loading-screen" role="status" aria-busy="true" aria-live="polite">
        <img class="engine-mark" src="assets/ui/emblem.webp" alt="" aria-hidden="true">
        <h1 id="loading-title" data-t="title">Ярость кайдзю: разрушь город</h1>
        <div id="loading-percent">0%</div>
        <div class="loading-bar" id="loading-meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loading-progress"></div></div>
        <div class="loading-text" data-t="loading">Загрузка…</div>
        <button id="loading-retry" type="button" hidden></button>
    </div>

    <!-- Порядок значим: Constants.js первым (остальные читают его глобалы), main.js последним -->
    <script src="https://games.pikabu.ru/sdk/sdk.js"></script>
<script src="js/Constants.js?v=0.2.5-b24475ef"></script>
    <!-- 1.40 ads-ui: поле игры на десктопе не шире 2:1 (Playgama); вторым — его resize идёт раньше обработчиков движка -->
    <script src="js/ViewCap.js?v=0.2.5-b24475ef"></script>
    <script src="libs/simplex-noise.js?v=0.2.5-b24475ef"></script>
    <script src="libs/babylon.js?v=0.2.5-b24475ef"></script>
    <script src="libs/rapier.js?v=0.2.5-b24475ef"></script>
    <script src="js/Maps.js?v=0.2.5-b24475ef"></script>
    <script src="js/Maps2D.js?v=0.2.5-b24475ef"></script>
    <script src="js/World2D.js?v=0.2.5-b24475ef"></script>
    <script src="js/World3D.js?v=0.2.5-b24475ef"></script>
    <script src="js/Terrain3D.js?v=0.2.5-b24475ef"></script>
    <script src="js/CameraControl.js?v=0.2.5-b24475ef"></script>
    <!-- 1.40: камера не заслоняется сценой (столкновение, полупрозрачные заслоны) -->
    <script src="js/CameraSight.js?v=0.2.5-b24475ef"></script>
    <script src="js/Model3D.js?v=0.2.5-b24475ef"></script>
    <script src="js/ModelFBX.js?v=0.2.5-b24475ef"></script>
    <script src="js/ModelOBJ.js?v=0.2.5-b24475ef"></script>
    <script src="js/ModelGLTF.js?v=0.2.5-b24475ef"></script>
    <script src="js/Location3D.js?v=0.2.5-b24475ef"></script>
    <!-- world-a: Rig.js (риги и клипы), Nav.js (коллизии, высоты, пути) -->
    <script src="js/Rig.js?v=0.2.5-b24475ef"></script>
    <script src="js/Nav.js?v=0.2.5-b24475ef"></script>
    <!-- 1.30 мир (world-b): уровни графики и время суток -->
    <script src="js/Quality.js?v=0.2.5-b24475ef"></script>
    <script src="js/Sky3D.js?v=0.2.5-b24475ef"></script>
    <script src="js/Pause.js?v=0.2.5-b24475ef"></script>
    <script src="js/Sound.js?v=0.2.5-b24475ef"></script>
    <script src="js/Lang.js?v=0.2.5-b24475ef"></script>
    <script src="js/Platform.js?v=0.2.5-b24475ef"></script>
    <!-- Адаптеры площадок (Platform.register): Playgama; игра добавляет свои здесь же, после Platform.js -->
    <script src="js/PlatformPlaygama.js?v=0.2.5-b24475ef"></script>
    <!-- Адаптеры Telegram Mini App, CrazyGames, Android-обёртки и сборки test (detect() выбирает площадку) -->
    <script src="js/PlatformTelegram.js?v=0.2.5-b24475ef"></script>
    <script src="js/PlatformCrazy.js?v=0.2.5-b24475ef"></script>
    <script src="js/PlatformPikabu.js?v=0.2.5-b24475ef"></script>
    <script src="js/PlatformAndroid.js?v=0.2.5-b24475ef"></script>
    <script src="js/PlatformTest.js?v=0.2.5-b24475ef"></script>
    <script src="js/LoadingScreen.js?v=0.2.5-b24475ef"></script>
    <script src="js/ParticleFX.js?v=0.2.5-b24475ef"></script>
    <script src="js/Telemetry.js?v=0.2.5-b24475ef"></script>
    <!-- 1.30 systems-b: магазин косметики, Daily Gift, колесо фортуны (логика без UI, опт-ин: Shop/DailyGift/Wheel.init в Game.js) -->
    <script src="js/Shop.js?v=0.2.5-b24475ef"></script>
    <script src="js/DailyGift.js?v=0.2.5-b24475ef"></script>
    <script src="js/Wheel.js?v=0.2.5-b24475ef"></script>
    <!-- 1.30 systems-a: ввод, раскладка HUD, обучение. Opt-in: игра сама зовёт Input.init / HudLayout.init / Tutorial.init -->
    <script src="js/HudLayout.js?v=0.2.5-b24475ef"></script>
    <script src="js/Input.js?v=0.2.5-b24475ef"></script>
    <script src="js/Tutorial.js?v=0.2.5-b24475ef"></script>
    <script src="js/LiveWater3D.js?v=0.2.5-b24475ef"></script>
    <!-- 1.40 motion: физический блочный персонаж (opt-in). Порядок значим: MotionMath (GM) -> Humanoid -> MotionMatch -> CharacterPhysics -> Ragdoll -> Character -->
    <script src="js/MotionMath.js?v=0.2.5-b24475ef"></script>
    <script src="js/Humanoid.js?v=0.2.5-b24475ef"></script>
    <script src="js/MotionMatch.js?v=0.2.5-b24475ef"></script>
    <script src="js/CharacterPhysics.js?v=0.2.5-b24475ef"></script>
    <script src="js/Ragdoll.js?v=0.2.5-b24475ef"></script>
    <script src="js/Character.js?v=0.2.5-b24475ef"></script>
    <!-- 1.40 obby (ветка obby): трасса из деталей карты, тело героя, боты и их чат, вид. Опт-ин: игра сама зовёт ObbyCourse.build / ObbyBots.init -->
    <script src="js/ObbyCourse.js?v=0.2.5-b24475ef"></script>
    <script src="js/ObbyBody.js?v=0.2.5-b24475ef"></script>
    <script src="js/ObbyChat.js?v=0.2.5-b24475ef"></script>
    <script src="js/ObbyBots.js?v=0.2.5-b24475ef"></script>
    <script src="js/ObbyCourseView.js?v=0.2.5-b24475ef"></script>
    <script src="js/ObbyAvatar.js?v=0.2.5-b24475ef"></script>
    <!-- Скрипты игры (js/Game.js и её модули) — здесь, до main.js -->
    <script src="js/GameData.js?v=0.2.5-b24475ef"></script>
    <script src="js/GameStyle.js?v=0.2.5-b24475ef"></script>
    <script src="js/GamePhysics.js?v=0.2.5-b24475ef"></script>
    <script src="js/GameArch.js?v=0.2.5-b24475ef"></script>

    <script src="js/GameTraffic.js?v=0.2.5-b24475ef"></script>
    <script src="js/GameCrowd.js?v=0.2.5-b24475ef"></script>
    <script src="js/GameLook.js?v=0.2.5-b24475ef"></script>
    <script src="js/GameUI.js?v=0.2.5-b24475ef"></script>
    <script src="js/Game.js?v=0.2.5-b24475ef"></script>
    <script src="js/GameAudio.js?v=0.2.5-b24475ef"></script>
    <script src="js/GameFX.js?v=0.2.5-b24475ef"></script>
    <script src="js/GameShopData.js?v=0.2.5-b24475ef"></script>
    <script src="js/GameShopUI.js?v=0.2.5-b24475ef"></script>
    <script src="js/PikabuShop.js?v=0.2.5-b24475ef"></script>
    <script src="js/PikabuPacks.js?v=0.2.5-b24475ef"></script>
    <script src="js/main.js?v=0.2.5-b24475ef"></script>
    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
</body>
</html>
